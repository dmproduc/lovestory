<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Story</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0d11;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .video-card {
      width: 100%;
      max-width: 480px;
      background: #16161f;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 105, 180, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
    }
    video {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <div class="video-card">
    <div class="video-wrapper">
      <!-- Видео файлы осы жерде: вид1.mp4 -->
      <video controls playsinline preload="metadata">
        <source src="вид1.mp4" type="video/mp4">
        Браузеріңіз бұл видеоны қолдамайды.
      </video>
    </div>
  </div>

</body>
</html>
